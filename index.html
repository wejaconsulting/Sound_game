<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sing Song 🎤✨</title>
  <meta name="description" content="Lyssna på melodin, sjung tonerna, överlev rundan – ett sångspel med disco-vibe.">
  <meta name="theme-color" content="#12002b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sing Song">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Righteous&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-anim"></div>
  <div class="floaters" aria-hidden="true"></div>

  <!-- ===== STARTSKÄRM ===== -->
  <section id="screen-start" class="screen active">
    <div class="disco-ball" aria-hidden="true">
      <div class="ball"></div>
      <div class="string"></div>
    </div>

    <h1 class="logo">Sing<span>Song</span></h1>
    <p class="tagline">Lyssna på melodin. Sjung tonerna. Överlev rundan. 🎤</p>

    <div class="party-box">
      <h2 class="party-title">Vilka ska sjunga?</h2>
      <div id="player-chips" class="player-chips"></div>
      <div class="add-player">
        <input id="player-name" type="text" maxlength="12" placeholder="Skriv namn…" autocomplete="off">
        <div id="avatar-grid" class="avatar-grid"></div>
        <button id="btn-add-player" class="btn small">➕ Lägg till spelare</button>
      </div>
    </div>

    <p class="pick-level-hint">…och välj nivå för att starta:</p>
    <div class="level-grid">
      <button class="level-card" data-level="latt">
        <span class="lvl-emoji">🟢</span>
        <span class="lvl-name">Lätt</span>
        <span class="lvl-desc">Barnvisor, korta bitar, 2 missar tillåtna</span>
      </button>
      <button class="level-card" data-level="medium">
        <span class="lvl-emoji">🟡</span>
        <span class="lvl-name">Medium</span>
        <span class="lvl-desc">Kända melodier med tempo, 1 miss tillåten</span>
      </button>
      <button class="level-card" data-level="svar">
        <span class="lvl-emoji">🟠</span>
        <span class="lvl-name">Svår</span>
        <span class="lvl-desc">Beethoven &amp; Greensleeves, 1 miss tillåten</span>
      </button>
      <button class="level-card" data-level="hardcore">
        <span class="lvl-emoji">🔥</span>
        <span class="lvl-name">Hardcore</span>
        <span class="lvl-desc">Kromatiska klassiker, noll missar!</span>
      </button>
    </div>

    <p class="highscore" id="highscore-text"></p>
    <p class="mic-note">🎙️ Appen behöver din mikrofon för att höra hur du sjunger.</p>
    <p class="mic-error" id="mic-error" hidden></p>
  </section>

  <!-- ===== SPELSKÄRM ===== -->
  <section id="screen-game" class="screen">
    <header class="hud">
      <div class="hud-item"><span class="hud-label">Sjunger</span><span id="hud-player">–</span></div>
      <div class="hud-item"><span class="hud-label">Runda</span><span id="hud-round">1</span></div>
      <div class="hud-item"><span class="hud-label">Poäng</span><span id="hud-score">0</span></div>
      <div class="hud-item"><span class="hud-label">Missar kvar</span><span id="hud-lives">❤️❤️</span></div>
    </header>

    <div class="sheet-card">
      <div class="sheet-glow"></div>
      <svg id="staff" viewBox="0 0 800 240" preserveAspectRatio="xMidYMid meet"></svg>
    </div>

    <div class="status-row">
      <div id="status-text" class="status-text">Gör dig redo…</div>
    </div>

    <div class="meter-wrap" id="meter-wrap">
      <div class="meter-labels"><span>♭ för lågt</span><span id="meter-note">–</span><span>för högt ♯</span></div>
      <div class="meter-track">
        <div class="meter-zone" id="meter-zone"></div>
        <div class="meter-needle" id="meter-needle"></div>
      </div>
    </div>

    <div class="game-buttons">
      <button id="btn-replay" class="btn small">🔁 Hör igen (<span id="replay-count">0</span>)</button>
      <button id="btn-quit" class="btn small ghost">Avsluta</button>
    </div>

    <!-- Scenen där avatarerna står, som i Wii -->
    <div class="stage">
      <div id="stage-avatars" class="stage-avatars"></div>
      <div class="stage-floor"></div>
    </div>
  </section>

  <!-- ===== GAME OVER ===== -->
  <section id="screen-gameover" class="screen">
    <div class="disco-ball sad" aria-hidden="true">
      <div class="ball"></div>
      <div class="string"></div>
    </div>
    <h1 class="gameover-title" id="gameover-title">DU ÅKTE UT!</h1>
    <p class="gameover-sub" id="gameover-reason"></p>
    <div id="podium" class="podium" hidden></div>
    <div class="result-card">
      <div id="scoreboard" class="scoreboard"></div>
      <div class="result-row"><span>Nivå</span><strong id="res-level">–</strong></div>
      <div class="result-row"><span>Rundor klarade</span><strong id="res-rounds">0</strong></div>
      <div class="result-row"><span>Rekord</span><strong id="res-best">0</strong></div>
    </div>
    <div class="game-buttons">
      <button id="btn-retry" class="btn">🎤 Sjung igen</button>
      <button id="btn-menu" class="btn ghost">Byt nivå</button>
    </div>
  </section>

  <script src="audio.js"></script>
  <script src="pitch.js"></script>
  <script src="songs.js"></script>
  <script src="avatars.js"></script>
  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('sw.js').catch(() => { /* offline-stöd är valfritt */ });
    }
  </script>
</body>
</html>
